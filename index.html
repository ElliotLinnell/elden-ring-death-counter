<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elden Ring — Death Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c8a865;
    --gold-bright: #e8cf9a;
    --gold-dim: #8a7345;
    --blood: #8b1a1a;
    --blood-bright: #c0392b;
    --bg: #0c0a08;
    --panel: #16120d;
    --panel-edge: #2e2618;
    --text: #d8cdb4;
    --text-dim: #7d745f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% -20%, #241c10 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'EB Garamond', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
    overflow-x: hidden;
  }

  /* drifting ember particles */
  .ember {
    position: fixed;
    bottom: -10px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0;
    pointer-events: none;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0) scale(1); opacity: 0; }
    10%  { opacity: 0.7; }
    100% { transform: translate(var(--drift), -110vh) scale(0.3); opacity: 0; }
  }

  header { text-align: center; margin-bottom: 40px; z-index: 1; }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--gold-bright);
    text-shadow: 0 0 24px rgba(200, 168, 101, 0.35);
    text-transform: uppercase;
  }

  .subtitle {
    margin-top: 10px;
    font-style: italic;
    font-size: 17px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
  }

  .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 18px;
    color: var(--gold-dim);
  }
  .ornament::before, .ornament::after {
    content: "";
    height: 1px;
    width: 120px;
    background: linear-gradient(90deg, transparent, var(--gold-dim));
  }
  .ornament::after { background: linear-gradient(90deg, var(--gold-dim), transparent); }

  .total-bar {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 36px;
    z-index: 1;
  }
  .total-bar b {
    color: var(--gold);
    font-size: 20px;
    font-weight: 600;
    margin-left: 8px;
  }

  .arena {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 340px));
    gap: 32px;
    justify-content: center;
    width: 100%;
    max-width: 800px;
    z-index: 1;
  }

  .card {
    background: linear-gradient(180deg, #1a1510 0%, var(--panel) 100%);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 32px 28px 28px;
    text-align: center;
    position: relative;
    transition: border-color 0.3s, box-shadow 0.3s, transform 0.15s;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(200, 168, 101, 0.12);
    border-radius: 4px;
    pointer-events: none;
  }
  .card:hover {
    border-color: var(--gold-dim);
    box-shadow: 0 0 32px rgba(200, 168, 101, 0.08);
  }
  .card.struck { animation: strike 0.45s ease; }
  @keyframes strike {
    0%   { transform: translate(0,0); }
    15%  { transform: translate(-6px, 2px); box-shadow: 0 0 40px rgba(139, 26, 26, 0.6); }
    30%  { transform: translate(5px, -2px); }
    45%  { transform: translate(-3px, 1px); }
    60%  { transform: translate(2px, 0); }
    100% { transform: translate(0,0); }
  }

  .crest {
    width: 64px; height: 64px;
    margin: 0 auto 14px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--gold-bright);
    background: radial-gradient(circle at 50% 35%, #2a2114, #14100a);
    box-shadow: inset 0 0 18px rgba(0,0,0,0.7);
  }

  .name {
    font-family: 'Cinzel', serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .epithet {
    height: 22px;
    margin-top: 6px;
    font-style: italic;
    font-size: 15px;
    color: var(--blood-bright);
    letter-spacing: 0.04em;
    transition: opacity 0.4s;
  }

  .count {
    font-family: 'Cinzel', serif;
    font-size: 96px;
    font-weight: 700;
    line-height: 1.1;
    color: var(--text);
    text-shadow: 0 4px 18px rgba(0,0,0,0.8);
    font-variant-numeric: tabular-nums;
    margin: 6px 0 4px;
    transition: color 0.3s;
  }
  .count.bump { animation: bump 0.35s ease; color: var(--blood-bright); }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  .count-label {
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 22px;
  }

  .controls { display: flex; justify-content: center; gap: 12px; }

  button {
    font-family: 'Cinzel', serif;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    letter-spacing: 0.1em;
  }

  .btn-add {
    background: linear-gradient(180deg, #3a2a1a, #241a0e);
    border: 1px solid var(--gold-dim);
    color: var(--gold-bright);
    font-size: 24px;
    font-weight: 600;
    padding: 10px 42px;
  }
  .btn-add:hover {
    background: linear-gradient(180deg, #4a3622, #2e2112);
    border-color: var(--gold);
    box-shadow: 0 0 18px rgba(200, 168, 101, 0.25);
  }
  .btn-add:active { transform: scale(0.95); }

  .btn-sub {
    background: transparent;
    border: 1px solid #3a3328;
    color: var(--text-dim);
    font-size: 18px;
    padding: 10px 18px;
  }
  .btn-sub:hover { border-color: var(--text-dim); color: var(--text); }
  .btn-sub:active { transform: scale(0.95); }

  .hotkey {
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }
  .hotkey kbd {
    font-family: 'Cinzel', serif;
    border: 1px solid #3a3328;
    border-radius: 3px;
    padding: 1px 7px;
    margin: 0 2px;
    color: var(--gold-dim);
    font-size: 12px;
  }

  .footer {
    margin-top: 40px;
    display: flex;
    gap: 18px;
    z-index: 1;
  }
  .btn-reset {
    background: transparent;
    border: 1px solid #3a3328;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 10px 26px;
  }
  .btn-reset:hover { border-color: var(--blood); color: var(--blood-bright); }

  /* YOU DIED overlay */
  #died-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.82);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    z-index: 10;
  }
  #died-overlay.show { opacity: 1; }
  #died-text {
    font-family: 'Cinzel', serif;
    font-size: clamp(48px, 10vw, 110px);
    font-weight: 600;
    letter-spacing: 0.22em;
    color: #9e1f1f;
    text-shadow: 0 0 60px rgba(158, 31, 31, 0.8), 0 0 120px rgba(158, 31, 31, 0.4);
    transform: scale(0.92);
    transition: transform 2.2s ease-out;
  }
  #died-overlay.show #died-text { transform: scale(1.04); }
  #died-sub {
    margin-top: 18px;
    font-style: italic;
    font-size: 19px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

<div id="died-overlay" aria-hidden="true">
  <div id="died-text">YOU DIED</div>
  <div id="died-sub"></div>
</div>

<header>
  <h1>Death Counter</h1>
  <p class="subtitle">Put these foolish ambitions to rest</p>
  <div class="ornament">&#10070;</div>
</header>

<div class="total-bar">Souls lost to the Lands Between <b id="total">0</b></div>

<main class="arena">
  <section class="card" id="card-elliot">
    <div class="crest">E</div>
    <div class="name">Elliot</div>
    <div class="epithet" id="epithet-elliot"></div>
    <div class="count" id="count-elliot">0</div>
    <div class="count-label">Deaths</div>
    <div class="controls">
      <button class="btn-add" onclick="addDeath('elliot', 1)" aria-label="Add death for Elliot">+</button>
      <button class="btn-sub" onclick="addDeath('elliot', -1)" aria-label="Remove death for Elliot">&minus;</button>
    </div>
    <div class="hotkey">press <kbd>E</kbd> to perish</div>
  </section>

  <section class="card" id="card-jake">
    <div class="crest">J</div>
    <div class="name">Jake</div>
    <div class="epithet" id="epithet-jake"></div>
    <div class="count" id="count-jake">0</div>
    <div class="count-label">Deaths</div>
    <div class="controls">
      <button class="btn-add" onclick="addDeath('jake', 1)" aria-label="Add death for Jake">+</button>
      <button class="btn-sub" onclick="addDeath('jake', -1)" aria-label="Remove death for Jake">&minus;</button>
    </div>
    <div class="hotkey">press <kbd>J</kbd> to perish</div>
  </section>
</main>

<div class="footer">
  <button class="btn-reset" onclick="resetAll()">Begin new journey</button>
</div>

<script>
  const PLAYERS = ['elliot', 'jake'];
  const QUIPS = [
    'Skill issue, perhaps.',
    'The flask was right there.',
    'Margit sends his regards.',
    'Have you tried dodging?',
    'A dog did this, didn’t it.',
    'Rise, Tarnished. Again.',
    'That chest was a Mimic.',
    'Gravity: 1, Tarnished: 0.',
    'Maybe try fashion souls instead.',
    'The runes are gone. All of them.',
    'You were greedy with that last hit.',
    'Stand in the poison again, see what happens.'
  ];

  let counts = { elliot: 0, jake: 0 };
  try {
    const saved = localStorage.getItem('er-death-counter');
    if (saved) counts = { ...counts, ...JSON.parse(saved) };
  } catch (e) {}

  let overlayTimer = null;

  function save() {
    try { localStorage.setItem('er-death-counter', JSON.stringify(counts)); } catch (e) {}
  }

  function render() {
    let total = 0;
    for (const p of PLAYERS) {
      document.getElementById('count-' + p).textContent = counts[p];
      total += counts[p];
    }
    document.getElementById('total').textContent = total;

    for (const p of PLAYERS) document.getElementById('epithet-' + p).textContent = '';
    if (counts.elliot !== counts.jake) {
      const leader = counts.elliot > counts.jake ? 'elliot' : 'jake';
      document.getElementById('epithet-' + leader).textContent = 'The Ever-Dying';
    }
    save();
  }

  function addDeath(who, delta) {
    counts[who] = Math.max(0, counts[who] + delta);

    if (delta > 0) {
      const card = document.getElementById('card-' + who);
      const count = document.getElementById('count-' + who);
      card.classList.remove('struck'); void card.offsetWidth;
      card.classList.add('struck');
      count.classList.remove('bump'); void count.offsetWidth;
      count.classList.add('bump');
      showOverlay(who);
    }
    render();
  }

  function showOverlay(who) {
    const overlay = document.getElementById('died-overlay');
    const sub = document.getElementById('died-sub');
    const name = who.charAt(0).toUpperCase() + who.slice(1);
    sub.textContent = name + ' — ' + QUIPS[Math.floor(Math.random() * QUIPS.length)];
    overlay.classList.add('show');
    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(() => overlay.classList.remove('show'), 1800);
  }

  function resetAll() {
    if (!confirm('Begin a new journey? All deaths will be forgotten.')) return;
    counts = { elliot: 0, jake: 0 };
    render();
  }

  document.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === 'e') addDeath('elliot', 1);
    if (k === 'j') addDeath('jake', 1);
  });

  // ember particles
  for (let i = 0; i < 18; i++) {
    const ember = document.createElement('div');
    ember.className = 'ember';
    ember.style.left = Math.random() * 100 + 'vw';
    ember.style.setProperty('--drift', (Math.random() * 160 - 80) + 'px');
    ember.style.animationDuration = (7 + Math.random() * 9) + 's';
    ember.style.animationDelay = (Math.random() * 10) + 's';
    document.body.appendChild(ember);
  }

  render();
</script>
</body>
</html>
