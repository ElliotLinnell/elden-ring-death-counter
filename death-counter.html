<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elden Ring — Death Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c8a865;
    --gold-bright: #e8cf9a;
    --gold-dim: #8a7345;
    --blood: #8b1a1a;
    --blood-bright: #c0392b;
    --bg: #0c0a08;
    --panel: #16120d;
    --panel-edge: #2e2618;
    --text: #d8cdb4;
    --text-dim: #7d745f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% -20%, #241c10 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'EB Garamond', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
    overflow-x: hidden;
  }

  .ember {
    position: fixed;
    bottom: -10px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0;
    pointer-events: none;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0) scale(1); opacity: 0; }
    10%  { opacity: 0.7; }
    100% { transform: translate(var(--drift), -110vh) scale(0.3); opacity: 0; }
  }

  header { text-align: center; margin-bottom: 32px; z-index: 1; }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--gold-bright);
    text-shadow: 0 0 24px rgba(200, 168, 101, 0.35);
    text-transform: uppercase;
  }

  .subtitle {
    margin-top: 10px;
    font-style: italic;
    font-size: 17px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
  }

  .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 18px;
    color: var(--gold-dim);
  }
  .ornament::before, .ornament::after {
    content: "";
    height: 1px;
    width: 120px;
    background: linear-gradient(90deg, transparent, var(--gold-dim));
  }
  .ornament::after { background: linear-gradient(90deg, var(--gold-dim), transparent); }

  .total-bar {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 28px;
    z-index: 1;
  }
  .total-bar b {
    color: var(--gold);
    font-size: 20px;
    font-weight: 600;
    margin-left: 8px;
  }

  .foe-bar {
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 32px;
    width: 100%;
    max-width: 720px;
  }
  .foe-label {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  select, .boss-input {
    font-family: 'EB Garamond', serif;
    font-size: 17px;
    color: var(--gold-bright);
    background: var(--panel);
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 9px 14px;
    outline: none;
  }
  select { cursor: pointer; min-width: 260px; }
  select:hover, .boss-input:focus { border-color: var(--gold); }
  .boss-input { color: var(--text); width: 200px; display: none; }
  .boss-input::placeholder { color: var(--text-dim); font-style: italic; }

  .arena {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 340px));
    gap: 32px;
    justify-content: center;
    width: 100%;
    max-width: 800px;
    z-index: 1;
  }

  .card {
    background: linear-gradient(180deg, #1a1510 0%, var(--panel) 100%);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 32px 28px 28px;
    text-align: center;
    position: relative;
    transition: border-color 0.3s, box-shadow 0.3s, transform 0.15s;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(200, 168, 101, 0.12);
    border-radius: 4px;
    pointer-events: none;
  }
  .card:hover {
    border-color: var(--gold-dim);
    box-shadow: 0 0 32px rgba(200, 168, 101, 0.08);
  }
  .card.struck { animation: strike 0.45s ease; }
  @keyframes strike {
    0%   { transform: translate(0,0); }
    15%  { transform: translate(-6px, 2px); box-shadow: 0 0 40px rgba(139, 26, 26, 0.6); }
    30%  { transform: translate(5px, -2px); }
    45%  { transform: translate(-3px, 1px); }
    60%  { transform: translate(2px, 0); }
    100% { transform: translate(0,0); }
  }

  .crest {
    width: 64px; height: 64px;
    margin: 0 auto 14px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--gold-bright);
    background: radial-gradient(circle at 50% 35%, #2a2114, #14100a);
    box-shadow: inset 0 0 18px rgba(0,0,0,0.7);
  }

  .name {
    font-family: 'Cinzel', serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .epithet {
    height: 22px;
    margin-top: 6px;
    font-style: italic;
    font-size: 15px;
    color: var(--blood-bright);
    letter-spacing: 0.04em;
  }

  .count {
    font-family: 'Cinzel', serif;
    font-size: 88px;
    font-weight: 700;
    line-height: 1.1;
    color: var(--text);
    text-shadow: 0 4px 18px rgba(0,0,0,0.8);
    font-variant-numeric: tabular-nums;
    margin: 4px 0 0;
    transition: color 0.3s;
  }
  .count.bump { animation: bump 0.35s ease; color: var(--blood-bright); }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  .count-label {
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .vs-boss {
    font-size: 15px;
    font-style: italic;
    color: var(--text-dim);
    margin-bottom: 18px;
    min-height: 20px;
  }
  .vs-boss b { color: var(--gold-dim); font-weight: 500; font-style: normal; }

  .controls { display: flex; justify-content: center; gap: 12px; }

  button {
    font-family: 'Cinzel', serif;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    letter-spacing: 0.1em;
  }

  .btn-add {
    background: linear-gradient(180deg, #3a2a1a, #241a0e);
    border: 1px solid var(--gold-dim);
    color: var(--gold-bright);
    font-size: 24px;
    font-weight: 600;
    padding: 10px 42px;
  }
  .btn-add:hover {
    background: linear-gradient(180deg, #4a3622, #2e2112);
    border-color: var(--gold);
    box-shadow: 0 0 18px rgba(200, 168, 101, 0.25);
  }
  .btn-add:active { transform: scale(0.95); }

  .btn-sub {
    background: transparent;
    border: 1px solid #3a3328;
    color: var(--text-dim);
    font-size: 18px;
    padding: 10px 18px;
  }
  .btn-sub:hover { border-color: var(--text-dim); color: var(--text); }
  .btn-sub:active { transform: scale(0.95); }

  .hotkey {
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }
  .hotkey kbd {
    font-family: 'Cinzel', serif;
    border: 1px solid #3a3328;
    border-radius: 3px;
    padding: 1px 7px;
    margin: 0 2px;
    color: var(--gold-dim);
    font-size: 12px;
  }

  .ledger {
    z-index: 1;
    width: 100%;
    max-width: 720px;
    margin-top: 44px;
  }
  .ledger h2 {
    font-family: 'Cinzel', serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    text-align: center;
    margin-bottom: 18px;
  }
  .ledger table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    overflow: hidden;
  }
  .ledger th {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 12px 16px;
    border-bottom: 1px solid var(--panel-edge);
    text-align: right;
  }
  .ledger th:first-child { text-align: left; }
  .ledger td {
    font-size: 17px;
    padding: 11px 16px;
    border-bottom: 1px solid rgba(46, 38, 24, 0.5);
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .ledger td:first-child { text-align: left; color: var(--gold-bright); }
  .ledger tr:last-child td { border-bottom: none; }
  .ledger tbody tr { cursor: pointer; transition: background 0.15s; }
  .ledger tbody tr:hover { background: rgba(200, 168, 101, 0.05); }
  .ledger tbody tr.selected { background: rgba(200, 168, 101, 0.09); }
  .ledger tbody tr.selected td:first-child::before {
    content: "⚔ ";
    color: var(--blood-bright);
  }
  .ledger .empty {
    text-align: center;
    font-style: italic;
    color: var(--text-dim);
    padding: 22px;
    font-size: 16px;
  }
  .ledger .total-col { color: var(--gold); font-weight: 500; }

  .footer {
    margin-top: 40px;
    display: flex;
    gap: 18px;
    z-index: 1;
  }
  .btn-reset {
    background: transparent;
    border: 1px solid #3a3328;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 10px 26px;
  }
  .btn-reset:hover { border-color: var(--blood); color: var(--blood-bright); }

  #died-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.82);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    z-index: 10;
  }
  #died-overlay.show { opacity: 1; }
  #died-text {
    font-family: 'Cinzel', serif;
    font-size: clamp(48px, 10vw, 110px);
    font-weight: 600;
    letter-spacing: 0.22em;
    color: #9e1f1f;
    text-shadow: 0 0 60px rgba(158, 31, 31, 0.8), 0 0 120px rgba(158, 31, 31, 0.4);
    transform: scale(0.92);
    transition: transform 2.2s ease-out;
  }
  #died-overlay.show #died-text { transform: scale(1.04); }
  #died-sub {
    margin-top: 18px;
    font-style: italic;
    font-size: 19px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-align: center;
    padding: 0 20px;
  }
</style>
</head>
<body>

<div id="died-overlay" aria-hidden="true">
  <div id="died-text">YOU DIED</div>
  <div id="died-sub"></div>
</div>

<header>
  <h1>Death Counter</h1>
  <p class="subtitle">Put these foolish ambitions to rest</p>
  <div class="ornament">&#10070;</div>
</header>

<div class="total-bar">Souls lost to the Lands Between <b id="total">0</b></div>

<div class="foe-bar">
  <span class="foe-label">Current foe</span>
  <select id="boss-select" aria-label="Select current boss"></select>
  <input class="boss-input" id="boss-input" type="text" maxlength="60"
         placeholder="Name thy tormentor…" aria-label="New boss name">
</div>

<main class="arena">
  <section class="card" id="card-elliot">
    <div class="crest">E</div>
    <div class="name">Elliot</div>
    <div class="epithet" id="epithet-elliot"></div>
    <div class="count" id="count-elliot">0</div>
    <div class="count-label">Deaths</div>
    <div class="vs-boss" id="vs-elliot"></div>
    <div class="controls">
      <button class="btn-add" onclick="addDeath('elliot', 1)" aria-label="Add death for Elliot">+</button>
      <button class="btn-sub" onclick="addDeath('elliot', -1)" aria-label="Remove death for Elliot">&minus;</button>
    </div>
    <div class="hotkey">press <kbd>E</kbd> to perish</div>
  </section>

  <section class="card" id="card-jake">
    <div class="crest">J</div>
    <div class="name">Jake</div>
    <div class="epithet" id="epithet-jake"></div>
    <div class="count" id="count-jake">0</div>
    <div class="count-label">Deaths</div>
    <div class="vs-boss" id="vs-jake"></div>
    <div class="controls">
      <button class="btn-add" onclick="addDeath('jake', 1)" aria-label="Add death for Jake">+</button>
      <button class="btn-sub" onclick="addDeath('jake', -1)" aria-label="Remove death for Jake">&minus;</button>
    </div>
    <div class="hotkey">press <kbd>J</kbd> to perish</div>
  </section>
</main>

<section class="ledger">
  <h2>Tally of humiliations</h2>
  <table>
    <thead>
      <tr><th>Boss</th><th>Elliot</th><th>Jake</th><th>Total</th></tr>
    </thead>
    <tbody id="ledger-body"></tbody>
  </table>
</section>

<div class="footer">
  <button class="btn-reset" onclick="resetAll()">Begin new journey</button>
</div>

<script>
  const PLAYERS = ['elliot', 'jake'];
  const MISC = 'Open world & misc';
  const ADD_NEW = '__add_new__';
  const DEFAULT_BOSSES = [
    MISC,
    'Margit, the Fell Omen',
    'Godrick the Grafted',
    'Red Wolf of Radagon',
    'Rennala, Queen of the Full Moon',
    'Starscourge Radahn',
    'Rykard, Lord of Blasphemy',
    'Morgott, the Omen King',
    'Astel, Naturalborn of the Void',
    'Fire Giant',
    'Godskin Duo',
    'Maliketh, the Black Blade',
    'Godfrey / Hoarah Loux',
    'Radagon & Elden Beast',
    'Mohg, Lord of Blood',
    'Malenia, Blade of Miquella',
    'Dragonlord Placidusax',
    'Lichdragon Fortissax'
  ];
  const QUIPS = [
    'Skill issue, perhaps.',
    'The flask was right there.',
    'Have you tried dodging?',
    'A dog did this, didn’t it.',
    'Rise, Tarnished. Again.',
    'That chest was a Mimic.',
    'Gravity: 1, Tarnished: 0.',
    'Maybe try fashion souls instead.',
    'The runes are gone. All of them.',
    'You were greedy with that last hit.',
    'Stand in the poison again, see what happens.',
    'Try finger, but hole.'
  ];

  let state = { selected: MISC, order: [...DEFAULT_BOSSES], bosses: {} };
  for (const b of DEFAULT_BOSSES) state.bosses[b] = { elliot: 0, jake: 0 };

  try {
    const v2 = localStorage.getItem('er-death-counter-v2');
    if (v2) {
      const parsed = JSON.parse(v2);
      if (parsed && parsed.bosses && parsed.order) state = parsed;
    } else {
      const v1 = localStorage.getItem('er-death-counter');
      if (v1) {
        const old = JSON.parse(v1);
        state.bosses[MISC].elliot = old.elliot || 0;
        state.bosses[MISC].jake = old.jake || 0;
      }
    }
  } catch (e) {}

  let overlayTimer = null;

  function save() {
    try { localStorage.setItem('er-death-counter-v2', JSON.stringify(state)); } catch (e) {}
  }

  function totals() {
    const t = { elliot: 0, jake: 0 };
    for (const b of state.order) {
      t.elliot += state.bosses[b].elliot;
      t.jake += state.bosses[b].jake;
    }
    return t;
  }

  function renderSelect() {
    const sel = document.getElementById('boss-select');
    sel.innerHTML = '';
    for (const b of state.order) {
      const opt = document.createElement('option');
      opt.value = b;
      opt.textContent = b;
      sel.appendChild(opt);
    }
    const addOpt = document.createElement('option');
    addOpt.value = ADD_NEW;
    addOpt.textContent = '+ Add a boss…';
    sel.appendChild(addOpt);
    sel.value = state.selected;
  }

  function render() {
    const t = totals();
    document.getElementById('count-elliot').textContent = t.elliot;
    document.getElementById('count-jake').textContent = t.jake;
    document.getElementById('total').textContent = t.elliot + t.jake;

    for (const p of PLAYERS) {
      document.getElementById('epithet-' + p).textContent = '';
      const vs = state.bosses[state.selected][p];
      document.getElementById('vs-' + p).innerHTML =
        '<b>' + vs + '</b> vs ' + escapeHtml(shortName(state.selected));
    }
    if (t.elliot !== t.jake) {
      const leader = t.elliot > t.jake ? 'elliot' : 'jake';
      document.getElementById('epithet-' + leader).textContent = 'The Ever-Dying';
    }

    renderLedger();
    save();
  }

  function shortName(boss) {
    return boss.split(',')[0];
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderLedger() {
    const body = document.getElementById('ledger-body');
    body.innerHTML = '';
    const rows = state.order
      .map(b => ({ name: b, e: state.bosses[b].elliot, j: state.bosses[b].jake }))
      .filter(r => r.e + r.j > 0 || r.name === state.selected)
      .sort((a, b) => (b.e + b.j) - (a.e + a.j));

    if (rows.length === 0) {
      body.innerHTML = '<tr><td colspan="4" class="empty">No deaths yet. Suspicious.</td></tr>';
      return;
    }
    for (const r of rows) {
      const tr = document.createElement('tr');
      if (r.name === state.selected) tr.className = 'selected';
      tr.innerHTML = '<td>' + escapeHtml(r.name) + '</td><td>' + r.e + '</td><td>' + r.j +
        '</td><td class="total-col">' + (r.e + r.j) + '</td>';
      tr.onclick = () => {
        state.selected = r.name;
        document.getElementById('boss-select').value = r.name;
        render();
      };
      body.appendChild(tr);
    }
  }

  function addDeath(who, delta) {
    const b = state.bosses[state.selected];
    b[who] = Math.max(0, b[who] + delta);

    if (delta > 0) {
      const card = document.getElementById('card-' + who);
      const count = document.getElementById('count-' + who);
      card.classList.remove('struck'); void card.offsetWidth;
      card.classList.add('struck');
      count.classList.remove('bump'); void count.offsetWidth;
      count.classList.add('bump');
      showOverlay(who);
    }
    render();
  }

  function showOverlay(who) {
    const overlay = document.getElementById('died-overlay');
    const sub = document.getElementById('died-sub');
    const name = who.charAt(0).toUpperCase() + who.slice(1);
    const foe = state.selected === MISC ? 'the Lands Between' : shortName(state.selected);
    sub.textContent = name + ', felled by ' + foe + ' — ' +
      QUIPS[Math.floor(Math.random() * QUIPS.length)];
    overlay.classList.add('show');
    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(() => overlay.classList.remove('show'), 1800);
  }

  function resetAll() {
    if (!confirm('Begin a new journey? All deaths will be forgotten.')) return;
    state = { selected: MISC, order: [...DEFAULT_BOSSES], bosses: {} };
    for (const b of DEFAULT_BOSSES) state.bosses[b] = { elliot: 0, jake: 0 };
    renderSelect();
    render();
  }

  document.getElementById('boss-select').addEventListener('change', (e) => {
    const input = document.getElementById('boss-input');
    if (e.target.value === ADD_NEW) {
      input.style.display = 'inline-block';
      input.focus();
    } else {
      input.style.display = 'none';
      state.selected = e.target.value;
      render();
    }
  });

  document.getElementById('boss-input').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const name = e.target.value.trim();
    if (name) {
      if (!state.bosses[name]) {
        state.bosses[name] = { elliot: 0, jake: 0 };
        state.order.push(name);
      }
      state.selected = name;
    }
    e.target.value = '';
    e.target.style.display = 'none';
    renderSelect();
    render();
  });

  document.addEventListener('keydown', (e) => {
    if (e.repeat || e.target.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if (k === 'e') addDeath('elliot', 1);
    if (k === 'j') addDeath('jake', 1);
  });

  for (let i = 0; i < 18; i++) {
    const ember = document.createElement('div');
    ember.className = 'ember';
    ember.style.left = Math.random() * 100 + 'vw';
    ember.style.setProperty('--drift', (Math.random() * 160 - 80) + 'px');
    ember.style.animationDuration = (7 + Math.random() * 9) + 's';
    ember.style.animationDelay = (Math.random() * 10) + 's';
    document.body.appendChild(ember);
  }

  renderSelect();
  render();
</script>
</body>
</html>
